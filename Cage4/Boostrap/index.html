<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container bg-dark">

        <div class="row bg-primary">
            <div class="col-md-1 bg-secondary">col1</div>
            <div class="col-3 bg-info">col3</div>
            <div class="col-6 bg-warning">col6</div>
            <div class="col-6 bg-danger">col6</div>
            <div class="col-6 bg-secondary">col6</div>
        </div>

        <div class="row text-white">
            row
        </div>

    </div>

    <div class="container mt-2 border">
        <div class="row justify-content-center">
            <a href="" class="btn btn-primary col-md-2">Link 1</a>
            <a class="btn btn-danger col-md-2">Link 2</a>
            <a class="btn btn-warning col-md-2">Link 3</a>
            <a class="btn btn-success col-md-2">Link 4</a>
        </div>

    </div>

    <div class="container mt-2 border rounded shadow">
        <div class="row">
            <table class="table">
                <thead>
                    <tr>
                        <th>id</th>
                        <th>nome</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Jessica<td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>John</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Chris</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
